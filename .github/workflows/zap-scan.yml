name: ZAP fuzzing scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # каждый понедельник в 03:00 UTC

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Запустить приложение через Docker Compose
        run: docker compose up -d --build

      - name: Дождаться готовности backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "backend готов"
              exit 0
            fi
            echo "ожидание backend... ($i/30)"
            sleep 5
          done
          echo "backend не поднялся за отведённое время" >&2
          exit 1

      - name: Дождаться готовности frontend
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "frontend готов"
              exit 0
            fi
            echo "ожидание frontend... ($i/20)"
            sleep 3
          done
          echo "frontend не поднялся за отведённое время" >&2
          exit 1

      - name: Запустить ZAP baseline scan (API + frontend)
        run: bash scripts/zap-scan.sh

      - name: Сохранить отчёты ZAP как артефакт CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: docs/zap/reports/*
          if-no-files-found: warn

      - name: Логи приложения (для диагностики)
        if: always()
        run: docker compose logs --no-color

      - name: Остановить приложение
        if: always()
        run: docker compose down -v
