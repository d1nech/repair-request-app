server:
  port: ${PORT:8080}

spring:
  application:
    name: repair-request-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repair_db}
    username: ${SPRING_DATASOURCE_USERNAME:repair_user}
    password: ${SPRING_DATASOURCE_PASSWORD:repair_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-local-dev-secret-local-dev-secret-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
