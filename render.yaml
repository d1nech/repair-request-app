# Необязательный Blueprint для Render. Проще и надежнее развернуть вручную по docs/render-deploy.md,
# потому что URL frontend/backend после создания нужно подставить в переменные окружения.
services:
  - type: web
    name: repair-request-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: repair-request-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
